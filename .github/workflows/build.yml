name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: ./build.sh

      - name: Zip
        run: ditto -c -k --keepParent build/KeyHaptics.app KeyHaptics.zip

      - uses: actions/upload-artifact@v4
        with:
          name: KeyHaptics
          path: KeyHaptics.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KeyHaptics.zip
